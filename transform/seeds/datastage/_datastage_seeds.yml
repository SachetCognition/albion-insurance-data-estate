version: 2

seeds:
  # --------------------------------------------------------------------- #
  # RAW.SOURCE — legacy DataStage sequential-file inputs, landed verbatim. #
  # Generated by transform/scripts/datastage/build_datastage_seeds.py.     #
  # --------------------------------------------------------------------- #
  - name: raw_ds_customer
    description: >
      Customer dimension input of DataStage RETAIL_DATA_MART_Job
      (datastage/source_data/customer.txt). CustomerID is the partner-issued
      MKTG_CUST_ID identity scheme (6th silo, never crosswalked to PARTY_ID).
    config:
      database: RAW
      schema: SOURCE
      alias: ds_customer
      tags: ["raw", "datastage"]
      column_types:
        CustomerID: bigint
        customername: varchar
        SpendingScore: bigint
        AnnualIncomek: bigint
        gender: varchar
        age: bigint
        customertype: varchar

  - name: raw_ds_retail_store
    description: >
      Store (retail partner) dimension input of RETAIL_DATA_MART_Job
      (datastage/source_data/Retail.txt). Stockid is the store key.
    config:
      database: RAW
      schema: SOURCE
      alias: ds_retail_store
      tags: ["raw", "datastage"]
      column_types:
        Stockid: bigint
        name: varchar
        rating: bigint
        location: varchar
        noofemployees: bigint

  - name: raw_ds_product
    description: >
      Product dimension input of RETAIL_DATA_MART_Job
      (datastage/source_data/product.txt).
    config:
      database: RAW
      schema: SOURCE
      alias: ds_product
      tags: ["raw", "datastage"]
      column_types:
        productid: bigint
        productname: varchar
        Category: varchar
        SubCategory: varchar
        Sales: bigint
        Quantity: bigint

  - name: raw_ds_transaction_landing
    description: >
      Transaction fact input of RETAIL_DATA_MART_Job
      (datastage/source_data/transactiondata.txt) landed as RAW RECORDS,
      including the column-name header line (record_seq = 1), exactly as the
      DataStage sequential-file stage received it. Record splitting, type
      conversion and reject handling stay visible in stg_ds_transactions
      because one production record is malformed (an unescaped comma inside
      Description) and the legacy stage silently rejected it.
    config:
      database: RAW
      schema: SOURCE
      alias: ds_transaction_landing
      tags: ["raw", "datastage"]
      column_types:
        record_seq: bigint
        raw_record: varchar

  - name: raw_ds_polmstex_landing
    description: >
      FD-010 LIFE400 policy master extract (data/inbound_feeds/POLMSTEX_D260115.dat)
      landed as raw 116-byte fixed-width records. Input of the LOST DataStage
      job LIFE_POLICY_LOAD; the column-import stage is reconstructed in
      stg_life_policy_landing.
    config:
      database: RAW
      schema: SOURCE
      alias: ds_polmstex_landing
      tags: ["raw", "datastage"]
      column_types:
        record_seq: bigint
        raw_record: varchar

  - name: raw_ds_plcymstr_landing
    description: >
      FD-001 LEGACY_PAS policy master extract
      (data/inbound_feeds/PLCYMSTR_D260115.dat) landed as raw fixed-width
      records. Used by the life-book recovery as the only surviving source of
      CLIENT_NO and UK postcodes for the life population (ADDRMST was never
      migrated); parsed in stg_life_plcymstr_client.
    config:
      database: RAW
      schema: SOURCE
      alias: ds_plcymstr_landing
      tags: ["raw", "datastage"]
      column_types:
        record_seq: bigint
        raw_record: varchar

  # --------------------------------------------------------------------- #
  # GOLDEN.BASELINE — immutable "before" outputs for parity testing.      #
  # --------------------------------------------------------------------- #
  - name: golden_ds_retail_data_mart
    description: >
      Immutable legacy output of RETAIL_DATA_MART_Job
      (datastage/output_data/RETAIL_DATA_MART.txt). InvoiceDate is saturated
      at 2147483647 on 14 records — a 32-bit integer overflow in the legacy
      job, carried here verbatim as the "before" state.
    config:
      database: GOLDEN
      schema: BASELINE
      alias: ds_retail_data_mart
      tags: ["golden_baseline", "datastage"]
      column_types:
        productid: bigint
        productname: varchar
        Category: varchar
        SubCategory: varchar
        Sales: bigint
        Quantity: bigint
        CustomerID: bigint
        customername: varchar
        SpendingScore: bigint
        AnnualIncomek: bigint
        gender: varchar
        age: bigint
        customertype: varchar
        Stockid: bigint
        name: varchar
        rating: bigint
        location: varchar
        noofemployees: bigint
        Invoiceid: varchar
        Description: varchar
        InvoiceDate: bigint
        Price: bigint
        Country: varchar

  - name: golden_ds_count_customer_transactions
    description: >
      Immutable legacy output of Count_Customer_Transactions_Job
      (datastage/output_data/Count_Customers_Transactions.txt).
    config:
      database: GOLDEN
      schema: BASELINE
      alias: ds_count_customer_transactions
      tags: ["golden_baseline", "datastage"]
      column_types:
        CustomerID: bigint
        Stockid: bigint
        total_orders_num: bigint

  - name: golden_ds_life_policy_recon
    description: >
      RECONSTRUCTED baseline for the lost DataStage job LIFE_POLICY_LOAD.
      Not a captured legacy output — the job export and its Teradata target
      are both gone. It is an independent reimplementation (in
      transform/scripts/datastage/build_datastage_seeds.py) of the documented
      legacy behaviour: FD-010 fixed-width layout, integer YYMMDD landing
      columns per LIFE_DB.LIFE_POLICY, and the LIFE_DB.V_LIFE_POLICY
      derivations with pivot year 40. matched_party_id is carried as unmatched
      because the legacy name+DOB fuzzy match left no crosswalk, no suspect
      queue and no documented match rate.
    config:
      database: GOLDEN
      schema: BASELINE
      alias: ds_life_policy_recon
      tags: ["golden_baseline", "datastage"]
      column_types:
        life_policy_id: varchar
        application_id: varchar
        process_dt_yymmdd: bigint
        plan_cd: varchar
        contract_status: varchar
        insured_name: varchar
        insured_dob_yymmdd: bigint
        gender: varchar
        sum_assured: numeric(15, 2)
        modal_premium: numeric(15, 2)
        pay_freq: bigint
        matched_party_id: varchar
        insured_dob_ccyymmdd: bigint
        annualised_premium_in_force: numeric(18, 2)
