spring:
  application:
    name: albion-domain-api
  datasource:
    # In-memory H2 domain store. In production this is repointed at the
    # canonical dbt marts (mart_policy_360 / dim_party / dim_claim) in Snowflake.
    url: jdbc:h2:mem:albion;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate.format_sql: false
  h2:
    console:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
