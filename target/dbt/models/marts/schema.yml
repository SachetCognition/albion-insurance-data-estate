version: 2

models:
  - name: policy_360
    description: >
      Canonical Policy-360 mart. Column set is the shared Policy JSON contract
      served by the Policy Inquiry API (target/api). Replaces
      ETL_STAGING_DB.STG_POLICY_360. Governed definitions: active =
      policy_status in (IF, RN); earned premium = straight-line 1/12ths.
    columns:
      - name: policy_no
        tests:
          - not_null
          - unique
      - name: party_id
        tests:
          - not_null
      - name: active_policy_flag
        tests:
          - not_null
          - accepted_values:
              values: ['Y', 'N']
      - name: postcode_dq_status
        tests:
          - not_null
          - accepted_values:
              values: ['VALID', 'INVALID']
      - name: email_dq_status
        tests:
          - not_null
          - accepted_values:
              values: ['VALID', 'INVALID']

  - name: party_claims
    description: Claims keyed by canonical party_id for the Policy Inquiry API.
    columns:
      - name: claim_no
        tests:
          - not_null
          - unique
      - name: party_id
        tests:
          - not_null
